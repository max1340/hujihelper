<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background squircle (same palette as Подсчет хавчика & Финансы) -->
  <rect x="18" y="18" width="476" height="476" rx="104" fill="#0d0d0f" stroke="#27272a" stroke-width="2.5"/>

  <!-- Open Book / Schedule Card in foreground-bottom -->
  <g>
    <!-- Book base / cover shadow -->
    <rect x="96" y="248" width="320" height="168" rx="22" fill="#e4e4e7" stroke="#141417" stroke-width="6"/>
    <!-- Book main body -->
    <rect x="96" y="234" width="320" height="164" rx="20" fill="#ffffff" stroke="#141417" stroke-width="6"/>
    <!-- Center spine line -->
    <line x1="256" y1="238" x2="256" y2="394" stroke="#141417" stroke-width="5"/>

    <!-- Left page: schedule / study lines -->
    <rect x="124" y="266" width="84" height="10" rx="5" fill="#141417"/>
    <rect x="124" y="290" width="104" height="8" rx="4" fill="#71717a"/>
    <rect x="124" y="310" width="92" height="8" rx="4" fill="#71717a"/>
    <rect x="124" y="330" width="104" height="8" rx="4" fill="#a1a1aa"/>
    <rect x="124" y="350" width="68" height="8" rx="4" fill="#141417"/>

    <!-- Right page: Electrical Engineering badge + lightning bolt -->
    <circle cx="336" cy="316" r="46" fill="#141417"/>
    <path d="M 344 280 L 314 320 L 336 320 L 328 352 L 358 312 L 336 312 Z" fill="#ffffff"/>
  </g>

  <!-- Academic Graduation Cap (Mortarboard) at top -->
  <g>
    <!-- Cap skullcap base -->
    <path d="M 172 170 L 172 214 C 172 234 340 234 340 214 L 340 170 Z" fill="#f4f4f5" stroke="#141417" stroke-width="6" stroke-linejoin="round"/>
    <!-- Mortarboard top diamond -->
    <polygon points="256,84 410,150 256,216 102,150" fill="#ffffff" stroke="#141417" stroke-width="6.5" stroke-linejoin="round"/>
    <!-- Center button on cap -->
    <ellipse cx="256" cy="150" rx="14" ry="8" fill="#141417"/>
    <!-- Tassel cord & pendant -->
    <path d="M 256 150 L 366 176 L 366 226" fill="none" stroke="#a1a1aa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="357" y="220" width="18" height="26" rx="6" fill="#ffffff" stroke="#141417" stroke-width="4"/>
  </g>
</svg>
